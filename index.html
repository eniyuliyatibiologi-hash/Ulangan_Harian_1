<title>Ulangan Harian Organel Sel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: satu kolom baca (maks 720px), satu soal per layar dengan navigator nomor; palet pewarnaan hematoksilin (biru-ungu) dan eosin (merah muda) seperti preparat sel. */
:root{
  --bg:#F5F4FA; --surface:#FFFFFF; --fg:#1D1B2C; --muted:#5B5873; --line:#DAD7EA;
  --accent:#3D3B95; --accent-ink:#FFFFFF; --accent-soft:#E7E6F7;
  --eosin:#C2386E; --eosin-soft:#F8DCE8;
  --good:#1B7A4B; --good-soft:#DDF1E6; --bad:#B3261E; --bad-soft:#FBE3E0; --warn:#85570A; --warn-soft:#FAEED0;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12111B; --surface:#1B1A28; --fg:#ECEAF8; --muted:#A4A1BE; --line:#2E2C45;
    --accent:#A3A2F5; --accent-ink:#12111B; --accent-soft:#29284F;
    --eosin:#F27BA8; --eosin-soft:#4A1F33;
    --good:#62D69C; --good-soft:#14362A; --bad:#FF8F85; --bad-soft:#401E1C; --warn:#F2C45E; --warn-soft:#3A2E11;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12111B; --surface:#1B1A28; --fg:#ECEAF8; --muted:#A4A1BE; --line:#2E2C45;
  --accent:#A3A2F5; --accent-ink:#12111B; --accent-soft:#29284F;
  --eosin:#F27BA8; --eosin-soft:#4A1F33;
  --good:#62D69C; --good-soft:#14362A; --bad:#FF8F85; --bad-soft:#401E1C; --warn:#F2C45E; --warn-soft:#3A2E11;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:16px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 48px; min-height:100vh;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--f-mono)}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:3px solid var(--eosin);outline-offset:2px}

/* tombol */
.btn{font:600 15px/1 var(--f-body);border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:13px 20px;border-radius:10px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;min-height:46px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft);filter:none}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}

/* start */
.start{padding-top:max(28px,env(safe-area-inset-top,0px));display:grid;gap:28px}
.hero{display:grid;gap:20px;grid-template-columns:1fr;align-items:center}
@media(min-width:640px){.hero{grid-template-columns:1.1fr .9fr}}
.hero h1{font-size:clamp(32px,7vw,46px);font-weight:700}
.hero .lede{color:var(--muted);margin-top:12px;max-width:46ch}
.cellart{width:100%;max-width:340px;justify-self:center;height:auto}
.cellart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:16px;padding:0;list-style:none}
.facts li{font-family:var(--f-mono);font-size:13px;color:var(--fg)}
.facts b{color:var(--accent);font-weight:500}
.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px}
.field{display:grid;gap:6px;min-width:0}
.field label{font-weight:600;font-size:14px}
.field input{font:400 16px var(--f-body);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;width:100%;min-height:46px}
.field input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fields{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:560px){.fields{grid-template-columns:2fr 1fr}}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.rules{color:var(--muted);font-size:14px;display:grid;gap:4px}

/* bar atas */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.bar-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.bar-top .who{font-weight:600;overflow-wrap:anywhere}
.track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
@media(prefers-reduced-motion:reduce){.track i{transition:none}}

/* soal */
.q{padding-top:22px;display:grid;gap:16px}
.q-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-family:var(--f-mono);font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.tag.accent{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.tag.good{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.tag.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.tag.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.stem{font-size:17px;line-height:1.6}
.hint{font-size:14px;color:var(--muted)}
.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:none}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;cursor:pointer;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .ltr{font-family:var(--f-mono);font-weight:500;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--bg);border:1.5px solid var(--line);font-size:13px}
.opt.multi .ltr{border-radius:7px}
.opt.single .ltr{border-radius:50%}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:checked) .ltr{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt:has(input:focus-visible){outline:3px solid var(--eosin);outline-offset:2px}
.opt span.t{overflow-wrap:anywhere;padding-top:2px}

/* benar-salah */
.bs{display:grid;gap:10px}
.bs-row{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:10px;border:1.5px solid var(--line);border-radius:9px;font-weight:600;font-size:15px;background:var(--bg)}
.seg label:hover span{border-color:var(--accent)}
.seg input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible + span{outline:3px solid var(--eosin);outline-offset:2px}

/* navigasi */
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.navbox{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.navgrp{display:grid;gap:8px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.chip{font:500 14px var(--f-mono);height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0}
.chip.done{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chip.cur{outline:2px solid var(--eosin);outline-offset:1px}
.chip.ok{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.chip.part{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.confirm{background:var(--warn-soft);border:1px solid var(--warn);color:var(--fg);padding:14px;border-radius:10px;display:grid;gap:10px}

/* hasil */
.res{padding-top:max(28px,env(safe-area-inset-top,0px));display:grid;gap:22px}
.scorecard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:18px}
.who2{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big .n{font-family:var(--f-display);font-weight:700;font-size:clamp(64px,18vw,96px);line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums}
.big .of{font-family:var(--f-mono);color:var(--muted)}
.verdict{font-family:var(--f-display);font-size:22px;font-weight:600}
.bars{display:grid;gap:12px}
.bar-row{display:grid;gap:5px}
.bar-row .hd{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.bar-row .hd span:last-child{font-family:var(--f-mono);white-space:nowrap}
.meter{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meter i.lo{background:var(--eosin)}
.meter i.hi{background:var(--good)}
.fb{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px}
.fb h3{font-size:18px}
.fb ul{margin:0;padding-left:20px;display:grid;gap:6px}
.sec-title{font-size:20px;font-weight:700}
.copybox{font-family:var(--f-mono);font-size:13px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}
.note{font-size:14px;color:var(--muted)}

/* pembahasan */
.rev{padding-top:max(20px,env(safe-area-inset-top,0px));display:grid;gap:18px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.fbtn{font:500 14px var(--f-body);padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;scroll-margin-top:90px}
.ropts{display:grid;gap:8px}
.ropt{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.ropt .ltr{font-family:var(--f-mono);font-weight:500;width:26px;height:26px;display:grid;place-items:center;border-radius:6px;border:1.5px solid var(--line);font-size:12px;background:var(--surface)}
.ropt.key{border-color:var(--good);background:var(--good-soft)}
.ropt.key .ltr{background:var(--good);color:var(--surface);border-color:var(--good)}
.ropt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ropt.wrong .ltr{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.ropt .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ropt .tags .tag{font-size:11px;padding:2px 8px}
.ropt p{overflow-wrap:anywhere}
.why{border-left:3px solid var(--accent);padding:2px 0 2px 14px;display:grid;gap:6px;font-size:15px}
.why b{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:500}
.srow{display:grid;gap:8px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.srow.ok{border-color:var(--good);background:var(--good-soft)}
.srow.bad{border-color:var(--bad);background:var(--bad-soft)}
.srow .ans{display:flex;gap:6px;flex-wrap:wrap}
.srow .exp{font-size:14px;color:var(--muted)}
.foot{margin-top:30px;text-align:center}
</style>

};

];
var Q=[
{n:1,type:"pg",theme:"tumbuhan",lvl:"Penerapan",

 explain:"Krista adalah lipatan membran dalam mitokondria. Lipatan ini memperluas permukaan tempat rantai transpor elektron dan ATP sintase bekerja. Glikolisis berlangsung di sitosol, bukan di dalam mitokondria."},
{n:3,type:"pg",theme:"energi",lvl:"Penerapan",

{n:4,type:"pg",theme:"inti",lvl:"Pemahaman",

var MAXPTS={pg:1,mcma:2,bs:3};
var TOTAL=Q.reduce(function(s,q){return s+MAXPTS[q.type]},0); // 32

/* ====== STATE ====== */
var app=document.getElementById("app");
var st={screen:"start",name:"",kelas:"",idx:0,ans:{},perm:{},t0:0,t1:0,confirm:false,filter:"all",err:""};
var LET="ABCDE";

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function qByN(n){return Q[n-1]}

function reset(){
  st.ans={};st.perm={};st.idx=0;st.confirm=false;st.filter="all";
  Q.forEach(function(q){
    if(q.type==="pg")st.ans[q.n]=null;
    else if(q.type==="mcma"){st.ans[q.n]=[]}
    else st.ans[q.n]=[null,null,null];
    if(q.type!=="bs")st.perm[q.n]=shuffle(q.options.map(function(_,i){return i}));
  });
}
function isAnswered(q){
  var a=st.ans[q.n];
  if(q.type==="pg")return a!=null;
  if(q.type==="mcma")return a.length>0;
  return a.every(function(v){return v!=null});
}
function answeredCount(){return Q.filter(isAnswered).length}

/* ====== PENILAIAN ====== */
function grade(q){
  var a=st.ans[q.n],pts=0,status="none",max=MAXPTS[q.type];
  if(q.type==="pg"){
    if(a!=null){pts=a===q.key?1:0;status=pts?"ok":"bad"}
  }else if(q.type==="mcma"){
    if(a.length){
      var right=a.filter(function(i){return q.key.indexOf(i)>-1}).length;
      var wrong=a.length-right;
      if(right===q.key.length&&wrong===0){pts=2;status="ok"}
      else if(right>0&&wrong===0)status="part";
      else status="bad";
    }
  }else{
    var anyAns=a.some(function(v){return v!=null});
    if(anyAns){
      a.forEach(function(v,i){if(v===q.key[i])pts++});
      status=pts===3?"ok":pts===0?"bad":"part";
    }
  }
  return {pts:pts,max:max,status:status};
}
function compute(){
  var r={pts:0,sec:{},theme:{},grades:{}};
  SECTIONS.forEach(function(s){r.sec[s.id]={pts:0,max:0}});
  Object.keys(THEMES).forEach(function(k){r.theme[k]={pts:0,max:0}});
  Q.forEach(function(q){
    var g=grade(q);r.grades[q.n]=g;r.pts+=g.pts;
    var s=SECTIONS.filter(function(s){return q.n>=s.from&&q.n<=s.to})[0];
    r.sec[s.id].pts+=g.pts;r.sec[s.id].max+=g.max;
    r.theme[q.theme].pts+=g.pts;r.theme[q.theme].max+=g.max;
  });
  r.score=Math.round(r.pts/TOTAL*100);
  return r;
}
function verdict(score){
  if(score>=85)return {t:"Sangat baik",d:"Pemahamanmu tentang organel sel sudah kuat. Pertahankan, lalu coba jelaskan jalur sekresi dan dampak gangguan organel dengan kata-katamu sendiri."};
  if(score>=70)return {t:"Baik",d:"Dasar pemahamanmu sudah baik. Periksa soal yang salah pada pembahasan, terutama yang menuntut penalaran, supaya hasilnya makin mantap."};
  if(score>=55)return {t:"Cukup",d:"Konsep dasarmu mulai terbentuk, tetapi masih ada bagian yang tertukar. Baca pembahasan soal yang salah, lalu ulangi materi pada topik yang masih lemah di bawah ini."};
  return {t:"Perlu belajar ulang",d:"Beberapa konsep organel belum kokoh. Mulai dari struktur dan fungsi tiap organel, lalu pelajari bagaimana organel bekerja sama. Setelah itu kerjakan ulang soal ini."};
}
function fmtTime(ms){var m=Math.floor(ms/60000),s=Math.round((ms%60000)/1000);return m+" menit "+s+" detik"}

    h+='</div></div>';
  });
  if(st.confirm){
    var miss=Q.filter(function(q){return!isAnswered(q)}).map(function(q){return q.n});
    h+='<div class="confirm" role="alert"><p><b>Masih ada '+miss.length+' soal belum dijawab:</b> nomor '+miss.join(", ")+'. Soal yang kosong dihitung salah.</p>'+
      '<div class="btn-row"><button type="button" class="btn ghost" data-act="cancel">Lanjut mengerjakan</button><button type="button" class="btn" data-act="submit">Kumpulkan sekarang</button></div></div>';
  }else{
    h+='<div class="btn-row"><button type="button" class="btn" data-act="finish">Selesai dan lihat nilai</button></div>';
  }
  return h+'</div>';
}
function progHTML(){
  var c=answeredCount();
  return '<div class="bar-top"><span class="who">'+esc(st.name)+' · '+esc(st.kelas)+'</span><span class="mono note">Terjawab '+c+'/'+Q.length+'</span></div>'+
    '<div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="'+Q.length+'" aria-valuenow="'+c+'"><i style="width:'+(c/Q.length*100)+'%"></i></div>';
}
function viewQuiz(){
  var q=Q[st.idx];
  var sec=SECTIONS.filter(function(s){return q.n>=s.from&&q.n<=s.to})[0];
  var hint=q.type==="pg"?"Pilih satu jawaban yang paling tepat.":q.type==="mcma"?"Pilih semua jawaban yang benar. Jawaban benar lebih dari satu.":"Tentukan Benar atau Salah untuk setiap pernyataan.";
  return '<header class="bar" id="prog">'+progHTML()+'</header>'+
  '<section class="q" aria-labelledby="qt">'+
    '<div class="q-meta"><span class="tag accent">Soal '+q.n+' dari '+Q.length+'</span><span class="tag">'+sec.title+' · '+sec.sub+'</span><span class="tag">'+q.lvl+'</span></div>'+
    '<h2 id="qt" class="stem" style="font-family:var(--f-body);font-weight:500;letter-spacing:0;font-size:17px;line-height:1.6">'+q.stem+'</h2>'+
    tableHTML(q.table)+
    (q.ask?'<p class="stem">'+esc(q.ask)+'</p>':'')+
    '<p class="hint">'+hint+'</p>'+
    qBody(q)+
    '<div class="pager"><button type="button" class="btn ghost" data-go="'+(st.idx-1)+'"'+(st.idx===0?" disabled":"")+'>Sebelumnya</button>'+
    '<button type="button" class="btn" data-go="'+(st.idx+1)+'"'+(st.idx===Q.length-1?" disabled":"")+'>Berikutnya</button></div>'+
  '</section>'+navHTML();
}

/* ====== TAMPILAN: HASIL ====== */
function barRow(name,pts,max){
  var p=max?pts/max*100:0,cls=p>=80?"hi":p<60?"lo":"";
  return '<div class="bar-row"><div class="hd"><span>'+esc(name)+'</span><span>'+pts+' / '+max+'</span></div><div class="meter"><i class="'+cls+'" style="width:'+p+'%"></i></div></div>';
}
function summaryText(r){
  return "Ulangan Harian Biologi: Organel Sel\nNama: "+st.name+"\nKelas: "+st.kelas+"\nNilai: "+r.score+" ("+r.pts+" dari "+TOTAL+" poin)\n"+
    SECTIONS.map(function(s){return s.title+": "+r.sec[s.id].pts+"/"+r.sec[s.id].max}).join(" | ")+"\nWaktu: "+fmtTime(st.t1-st.t0);
}
function viewResult(){
  var r=st.result,v=verdict(r.score);
  var weak=[],strong=[];
  Object.keys(THEMES).forEach(function(k){
    var t=r.theme[k],p=t.pts/t.max;
    if(p<0.7)weak.push({k:k,p:p});else if(p>=0.85)strong.push(k);
  });
  weak.sort(function(a,b){return a.p-b.p});
  var wrongNs=Q.filter(function(q){return r.grades[q.n].status!=="ok"}).map(function(q){return q.n});
  var fb='<div class="fb"><h3>Umpan balik</h3><p>'+v.d+'</p>';
  if(strong.length)fb+='<p><b>Sudah kuat:</b> '+strong.map(function(k){return esc(THEMES[k].name)}).join("; ")+'.</p>';
  if(weak.length){
    fb+='<p><b>Perlu diperkuat:</b></p><ul>'+weak.map(function(w){return '<li><b>'+esc(THEMES[w.k].name)+'.</b> '+esc(THEMES[w.k].tip)+'</li>'}).join("")+'</ul>';
  }else{
    fb+='<p>Tidak ada topik yang tertinggal. Lanjutkan dengan soal penalaran lain atau jelaskan materi ini kepada temanmu.</p>';
  }
  fb+='</div>';
  return '<section class="res">'+
    '<div class="scorecard">'+
      '<div class="who2"><div><div class="label">Hasil ulangan</div><h2 style="margin-top:6px;font-size:22px">'+esc(st.name)+'</h2></div>'+
      '<div class="mono note" style="text-align:right">Kelas '+esc(st.kelas)+'<br>Waktu '+fmtTime(st.t1-st.t0)+'</div></div>'+
      '<div><div class="big"><span class="n">'+r.score+'</span><span class="of">/ 100 · '+r.pts+' dari '+TOTAL+' poin</span></div><p class="verdict" style="margin-top:8px">'+v.t+'</p></div>'+
      '<div class="bars">'+SECTIONS.map(function(s){return barRow(s.title+" · "+s.sub,r.sec[s.id].pts,r.sec[s.id].max)}).join("")+'</div>'+
    '</div>'+
    fb+
    '<div class="fb"><h3>Penguasaan per topik</h3><div class="bars">'+Object.keys(THEMES).map(function(k){return barRow(THEMES[k].name,r.theme[k].pts,r.theme[k].max)}).join("")+'</div></div>'+
    '<div class="fb"><h3>Kirim hasil ke guru</h3><p class="note">Hasil ini hanya tersimpan di layarmu. Salin ringkasan di bawah, atau ambil tangkapan layar, lalu kirim ke gurumu.</p>'+
      '<div class="copybox" id="sumbox">'+esc(summaryText(r))+'</div>'+
      '<div class="btn-row"><button class="btn ghost" type="button" data-act="copy" id="copybtn">Salin ringkasan</button></div></div>'+
    '<div class="btn-row"><button class="btn" type="button" data-act="review">Lihat pembahasan</button>'+
    (wrongNs.length?'<button class="btn ghost" type="button" data-act="reviewbad">Hanya soal yang belum benar ('+wrongNs.length+')</button>':'')+'</div>'+
  '</section>';
}

/* ====== TAMPILAN: PEMBAHASAN ====== */
function statusTag(g){
  var m={ok:["good","Benar"],bad:["bad","Salah"],part:["warn","Sebagian benar"],none:["warn","Tidak dijawab"]}[g.status];
  return '<span class="tag '+m[0]+'">'+m[1]+'</span><span class="tag">'+g.pts+' / '+g.max+' poin</span>';
}
function reviewCard(q){
  var g=st.result.grades[q.n],a=st.ans[q.n],h="";
  h+='<article class="rcard" id="q-'+q.n+'"><div class="q-meta"><span class="tag accent">Soal '+q.n+'</span>'+statusTag(g)+'<span class="tag">'+esc(THEMES[q.theme].name)+'</span></div>'+
    '<p class="stem">'+q.stem+'</p>'+tableHTML(q.table)+(q.ask?'<p class="stem">'+esc(q.ask)+'</p>':'');
  if(q.type==="bs"){
    h+='<div class="bs">'+q.st.map(function(s,i){
      var v=a[i],ok=v===q.key[i];
      return '<div class="srow '+(v==null?"":ok?"ok":"bad")+'"><p>'+esc(s)+'</p><div class="ans">'+
        '<span class="tag good">Kunci: '+(q.key[i]?"Benar":"Salah")+'</span>'+
        '<span class="tag '+(v==null?"warn":ok?"good":"bad")+'">Jawabanmu: '+(v==null?"kosong":v?"Benar":"Salah")+'</span></div>'+
        '<p class="exp">'+esc(q.why[i])+'</p></div>';
    }).join("")+'</div>';
  }else{
    h+='<div class="ropts">'+st.perm[q.n].map(function(oi,pos){
      var isKey=q.type==="pg"?oi===q.key:q.key.indexOf(oi)>-1;
      var chosen=q.type==="pg"?a===oi:a.indexOf(oi)>-1;
      var cls="ropt"+(isKey?" key":chosen?" wrong":"");
      var tags=(isKey?'<span class="tag good">Kunci</span>':'')+(chosen?'<span class="tag '+(isKey?"good":"bad")+'">Jawabanmu</span>':'');
      return '<div class="'+cls+'"><span class="ltr">'+LET[pos]+'</span><div><p>'+esc(q.options[oi])+'</p>'+(tags?'<div class="tags">'+tags+'</div>':'')+'</div></div>';
    }).join("")+'</div>';
  }
  h+='<div class="why"><b>Pembahasan</b><p>'+esc(q.explain||"")+'</p></div>';
  if(q.type==="bs")h=h.replace('<div class="why"><b>Pembahasan</b><p></p></div>','');
  return h+'</article>';
}
function viewReview(){
  var r=st.result;
  var list=Q.filter(function(q){return st.filter==="all"||r.grades[q.n].status!=="ok"});
  var chips="";
  SECTIONS.forEach(function(s){
    chips+='<div class="navgrp"><div class="note">'+s.title+'</div><div class="chips">';
    for(var n=s.from;n<=s.to;n++)chips+='<button type="button" class="chip '+r.grades[n].status.replace("none","bad")+'" data-jump="'+n+'" aria-label="Pembahasan soal '+n+'">'+n+'</button>';
    chips+='</div></div>';
  });
  return '<section class="rev">'+
    '<div><div class="label">Pembahasan</div><h2 style="margin-top:6px;font-size:26px">Nilaimu '+r.score+' · '+r.pts+' dari '+TOTAL+' poin</h2></div>'+
    '<div class="navbox" style="margin-top:0">'+chips+'<p class="note">Hijau benar, kuning sebagian benar, merah salah atau kosong.</p></div>'+
    '<div class="filters" role="group" aria-label="Filter soal">'+
      '<button class="fbtn" type="button" data-filter="all" aria-pressed="'+(st.filter==="all")+'">Semua soal ('+Q.length+')</button>'+
      '<button class="fbtn" type="button" data-filter="bad" aria-pressed="'+(st.filter==="bad")+'">Belum benar ('+Q.filter(function(q){return r.grades[q.n].status!=="ok"}).length+')</button>'+
    '</div>'+
    (list.length?list.map(reviewCard).join(""):'<div class="fb"><h3>Semua jawabanmu benar</h3><p>Tidak ada soal yang perlu dibahas ulang.</p></div>')+
    '<div class="btn-row foot" style="justify-content:center"><button class="btn ghost" type="button" data-act="toresult">Kembali ke nilai</button><button class="btn" type="button" data-act="retry">Kerjakan ulang</button></div>'+
  '</section>';
}

/* ====== RENDER & EVENT ====== */
function render(keepScroll){
  var html=st.screen==="start"?viewStart():st.screen==="quiz"?viewQuiz():st.screen==="result"?viewResult():viewReview();
  app.innerHTML=html;
  if(!keepScroll)window.scrollTo(0,0);
}
function refreshChrome(){
  var p=document.getElementById("prog"),n=document.getElementById("navbox");
  if(p)p.innerHTML=progHTML();
  if(n)n.outerHTML=navHTML();
}
function goto(i){
  if(i<0||i>=Q.length)return;
  st.idx=i;st.confirm=false;render();
}
function submit(){
  st.t1=Date.now();st.result=compute();st.screen="result";st.confirm=false;render();
}

app.addEventListener("submit",function(e){
  if(e.target.id!=="startForm")return;
  e.preventDefault();
  var nm=document.getElementById("nama").value.trim(),kl=document.getElementById("kelas").value.trim();
  st.name=nm;st.kelas=kl;
  if(!nm||!kl){
    st.err=!nm&&!kl?"Isi nama dan kelas dulu sebelum mulai.":!nm?"Nama belum diisi.":"Kelas belum diisi.";
    document.getElementById("err").textContent=st.err;
    document.getElementById(!nm?"nama":"kelas").focus();
    return;
  }
  st.err="";reset();st.t0=Date.now();st.screen="quiz";render();
});

app.addEventListener("change",function(e){
  var el=e.target,n=+el.getAttribute("data-q");
  if(!n||st.screen!=="quiz")return;
  var q=qByN(n);
  if(q.type==="pg")st.ans[n]=+el.value;
  else if(q.type==="mcma"){
    var v=+el.value,a=st.ans[n],k=a.indexOf(v);
    if(el.checked&&k<0)a.push(v);else if(!el.checked&&k>-1)a.splice(k,1);
  }else{
    st.ans[n][+el.getAttribute("data-s")]=el.value==="1";
  }
  st.confirm=false;
  refreshChrome();
});

app.addEventListener("click",function(e){
  var t=e.target.closest("[data-go],[data-act],[data-filter],[data-jump]");
  if(!t)return;
  if(t.hasAttribute("data-go")){if(!t.disabled)goto(+t.getAttribute("data-go"));return}
  if(t.hasAttribute("data-filter")){st.filter=t.getAttribute("data-filter");render(true);return}
  if(t.hasAttribute("data-jump")){
    var target=document.getElementById("q-"+t.getAttribute("data-jump"));
    if(!target){st.filter="all";render(true);target=document.getElementById("q-"+t.getAttribute("data-jump"))}
    if(target)target.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  var act=t.getAttribute("data-act");
  if(act==="finish"){
    if(answeredCount()<Q.length){st.confirm=true;refreshChrome();var b=document.getElementById("navbox");if(b)b.scrollIntoView({block:"nearest"})}
    else submit();
  }else if(act==="cancel"){st.confirm=false;refreshChrome()}
  else if(act==="submit")submit();
  else if(act==="review"){st.screen="review";st.filter="all";render()}
  else if(act==="reviewbad"){st.screen="review";st.filter="bad";render()}
  else if(act==="toresult"){st.screen="result";render()}
  else if(act==="retry"){st.screen="start";st.err="";render()}
  else if(act==="copy"){
    var txt=summaryText(st.result),btn=t;
    function done(msg){btn.textContent=msg;setTimeout(function(){btn.textContent="Salin ringkasan"},2200)}
    function fallback(){
      var box=document.getElementById("sumbox"),rg=document.createRange();rg.selectNodeContents(box);
      var s=window.getSelection();s.removeAllRanges();s.addRange(rg);done("Teks terpilih, tekan salin");
    }
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){done("Tersalin")},fallback)}
      else fallback();
    }catch(_){fallback()}
  }
});
render();
})();
</script>

</body></html>
